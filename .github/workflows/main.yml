name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 6.x

      - name: Run the Cake script
        uses: cake-build/cake-action@v3
        with:
          cake-version: 4.2.0
          verbosity: Diagnostic

      - uses: actions/upload-artifact@v7
        with:
          name: AchievementsAPI.dll
          path: AchievementsAPI/bin/Release/net6.0/AchievementsAPI.dll

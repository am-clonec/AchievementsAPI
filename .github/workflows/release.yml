name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Validate tag and derive version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a valid release tag (expected vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 6.x

      - name: Build and pack
        uses: cake-build/cake-action@v3
        with:
          cake-version: 4.2.0
          target: Pack

      - name: Collect release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp AchievementsAPI/bin/Release/net6.0/AchievementsAPI.dll release/
          cp AchievementsAPI.VF/bin/Release/net6.0/AchievementsAPI.dll release/AchievementsAPI-VF.dll
          # The package name carries the version, so this also proves the tag was applied to the build.
          cp "artifacts/CloneC.AchievementsAPI.${VERSION}.nupkg" release/
          cp "artifacts/CloneC.AchievementsAPI.VentFramework.${VERSION}.nupkg" release/
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*

  publish-nuget:
    name: Publish NuGet package
    needs: [build, release]
    runs-on: ubuntu-22.04
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release

      - name: Setup .NET
        if: env.NUGET_API_KEY != ''
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 6.x

      - name: Push to nuget.org
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push release/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Skipped
        if: env.NUGET_API_KEY == ''
        run: echo "NUGET_API_KEY secret not configured; skipping NuGet publish. The package is attached to the GitHub release."
